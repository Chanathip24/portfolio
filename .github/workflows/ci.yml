name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that need no database: types, lint, a production build on the sample data, and the component tests.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # PageProps and LayoutProps are generated by Next, and a fresh checkout has none yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ct
      # Only what ships to visitors; a dev-tool advisory should not block a deploy.
      - run: npm audit --omit=dev --audit-level=high

  # Feature and end-to-end tests: a real local Supabase (Docker, as `npm run db:start` does) and the production build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Leaves out the services the tests never use, which makes the start much faster.
      - run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,postgres-meta
      - name: Point the app at the local stack
        run: |
          supabase status -o env > /tmp/sb.env
          get() { grep "^$1=" /tmp/sb.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "ANALYTICS_SALT=$(openssl rand -hex 16)"
          } > .env.local
      - run: npm run build
      # One run for the feature and end-to-end projects, so there is one report with everything in it.
      - run: npx playwright test
      # Always, pass or fail, so the report can be opened after any run (Actions run page, "Artifacts" at the bottom).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 14
      - name: How to open the report
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Playwright report"
            echo "Download **playwright-report** from the Artifacts section at the bottom of this page, unzip it, then run:"
            echo '```'
            echo "npx playwright show-report path/to/playwright-report"
            echo '```'
            echo "Failed tests also appear as annotations on the pull request's Files tab."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: supabase stop --no-backup
