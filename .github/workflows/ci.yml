name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that need no database: types, lint, a production build on the sample data, and the component tests.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ct
      # Only what ships to visitors; a dev-tool advisory should not block a deploy.
      - run: npm audit --omit=dev --audit-level=high

  # Feature and end-to-end tests: a real local Supabase (Docker, as `npm run db:start` does) and the production build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Leaves out the services the tests never use, which makes the start much faster.
      - run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,postgres-meta
      - name: Point the app at the local stack
        run: |
          supabase status -o env > /tmp/sb.env
          get() { grep "^$1=" /tmp/sb.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "ANALYTICS_SALT=$(openssl rand -hex 16)"
          } > .env.local
      - run: npm run build
      - run: npm run test:feature
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
