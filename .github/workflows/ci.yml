name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks that need no database: types, lint, a production build on the sample data, and the component tests.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Kept between runs, so unchanged code is not compiled again.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-checks-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-checks-${{ hashFiles('package-lock.json') }}-
      # PageProps and LayoutProps are generated by Next, and a fresh checkout has none yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ct
      # Only what ships to visitors; a dev-tool advisory should not block a deploy.
      - run: npm audit --omit=dev --audit-level=high

  # Feature and end-to-end tests, split in three that run at the same time. Each one has its own local Supabase (Docker, as
  # `npm run db:start` does) and its own production build, so they cannot disturb each other's data.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Leaves out the services the tests never use, which makes the start much faster.
      - run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,postgres-meta
      - name: Point the app at the local stack
        run: |
          supabase status -o env > /tmp/sb.env
          get() { grep "^$1=" /tmp/sb.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)"
            echo "ANALYTICS_SALT=$(openssl rand -hex 16)"
          } > .env.local
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-e2e-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # A third of the test files, chosen so the three take about the same time.
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: supabase stop --no-backup

  # Joins the three shards' results into one HTML report and keeps it as a download.
  report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 14
      - name: How to open the report
        run: |
          {
            echo "### Playwright report"
            echo "Download **playwright-report** from the Artifacts section at the bottom of this page, unzip it, then run:"
            echo '```'
            echo "npx playwright show-report path/to/playwright-report"
            echo '```'
            echo "Failed tests also appear as annotations on the pull request's Files tab. On main, the report is also published as a web page."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the latest report from main as a web page (Settings > Pages > Source: GitHub Actions). Each run replaces the last one.
  pages:
    needs: report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report
      - id: deploy
        uses: actions/deploy-pages@v4
