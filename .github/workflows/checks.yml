name: Checks

# No database: types, lint, a build on the sample data, and the dependency audit. Called by ci.yml.
on: workflow_call

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-checks-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-checks-${{ hashFiles('package-lock.json') }}-
      - run: npx next typegen # PageProps and LayoutProps are generated; a fresh checkout has none
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high # only what ships to visitors
